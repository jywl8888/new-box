<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大宗商品实时看板</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--accent:#10b981;--up:#ef4444;--down:#10b981}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);padding:12px;padding-bottom:80px;max-width:480px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #334155;margin-bottom:12px}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.overview{display:flex;justify-content:space-around;background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px}
.overview div{text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:16px;background:#334155;font-size:13px;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.card-left{flex:1}
.symbol{font-weight:600;font-size:15px}
.name{font-size:12px;color:#94a3b8}
.price-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.price{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.change{font-size:13px;padding:2px 6px;border-radius:4px}
.up{color:var(--up)}.down{color:var(--down)}
.spark{width:60px;height:30px}
.drawer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:16px;transform:translateY(100%);transition:.3s;max-height:70vh;overflow-y:auto}
.drawer.open{transform:translateY(0)}
.drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close{background:none;border:none;color:var(--text);font-size:20px}
.chart{width:100%;height:180px;background:#0f172a;border-radius:8px;margin-bottom:12px}
.ohlc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;font-size:13px}
.trades{font-size:12px;max-height:120px;overflow-y:auto}
.trade{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155}
.alert-bar{position:fixed;top:0;left:0;right:0;background:var(--up);color:#fff;padding:10px;text-align:center;font-size:14px;transform:translateY(-100%);transition:.3s;z-index:100}
.alert-bar.show{transform:translateY(0)}
</style>
</head>
<body>

<div class="alert-bar" id="alertBar"></div>

<div class="header">
  <div style="font-weight:700;font-size:16px">?? 大宗商品实时看板</div>
  <div class="status"><div class="dot"></div><span id="lastUpdate">连接中...</span></div>
</div>

<div class="overview">
  <div>上涨<br><span id="upCount" style="color:var(--up);font-weight:700">0</span></div>
  <div>下跌<br><span id="downCount" style="color:var(--down);font-weight:700">0</span></div>
  <div>吞吐<br><span id="tps" style="font-weight:700">0</span> t/s</div>
</div>

<div class="tabs">
  <div class="tab active" data-cat="all">全部</div>
  <div class="tab" data-cat="黑色">黑色</div>
  <div class="tab" data-cat="有色">有色</div>
  <div class="tab" data-cat="能化">能化</div>
  <div class="tab" data-cat="农产">农产</div>
</div>

<div class="list" id="list"></div>

<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div style="font-weight:700;font-size:16px" id="drawerTitle"></div>
    <button class="close" onclick="closeDrawer()">×</button>
  </div>
  <canvas class="chart" id="chart"></canvas>
  <div class="ohlc">
    <div>开盘: <span id="o"></span></div>
    <div>最高: <span id="h"></span></div>
    <div>最低: <span id="l"></span></div>
    <div>收盘: <span id="c"></span></div>
  </div>
  <div class="trades" id="trades"></div>
</div>

<script>
const symbols = [
  {s:"rb",name:"螺纹钢",cat:"黑色",base:3680},
  {s:"hc",name:"热卷",cat:"黑色",base:3820},
  {s:"i",name:"铁矿石",cat:"黑色",base:845},
  {s:"cu",name:"沪铜",cat:"有色",base:69250},
  {s:"al",name:"沪铝",cat:"有色",base:19200},
  {s:"zn",name:"沪锌",cat:"有色",base:24850},
  {s:"ru",name:"橡胶",cat:"能化",base:14280},
  {s:"ma",name:"甲醇",cat:"能化",base:2580},
  {s:"pp",name:"PP",cat:"能化",base:7680},
  {s:"c",name:"玉米",cat:"农产",base:2680},
  {s:"a",name:"大豆",cat:"农产",base:4820},
  {s:"y",name:"豆油",cat:"农产",base:8120}
];

const state = {};
symbols.forEach(x=>{
  state[x.s]={price:x.base,history:[...Array(30)].map(()=>x.base),trades:[],open:x.base,high:x.base,low:x.base}
});

let tickCount=0,lastSec=Date.now(),tps=0;
const listEl=document.getElementById("list");
const ale
